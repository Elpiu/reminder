name: Deploy su GitHub Pages

# Ogni push su master (o un avvio manuale) verifica il progetto, genera la PWA
# con base /reminder/ e la pubblica sul branch gh-pages, da cui GitHub Pages la serve.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile

      - name: Test e lint
        run: |
          pnpm test
          pnpm lint

      - name: Build statica
        run: pnpm build
        env:
          NUXT_APP_BASE_URL: /reminder/

      - name: Pubblica su gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          publish_branch: gh-pages
          commit_message: "Deploy ${{ github.sha }}"
